<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahhyun Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="./styles.css?v=e41fda37">
  <link rel="stylesheet" href="./intro.css?v=e41fda37">
</head>
<body>
  <div class="intro" id="intro" aria-hidden="true">
    <div class="pill" id="pill"><span class="pill-mask" id="pillMask"></span></div>
  </div>
  <div class="bg-layer" id="bgLayer" aria-hidden="true"></div>
  <div class="hover-bg" id="hoverBg" aria-hidden="true"></div>
  <div class="scroll-hint" id="scrollHint" aria-hidden="true"><span></span></div>
  <main class="stage">
    <div class="ring" id="ring"></div>
    <div class="cards" id="cards"></div>
    <div class="hero-title" id="heroTitle"></div>
    <nav class="thumbs" id="thumbs" aria-label="프로젝트 목록"></nav>
    <div class="center" id="center">
      <h1 class="headline"><span class="mask"><span class="word" id="word"></span></span></h1>
      <nav class="filters" id="filters" aria-label="분야"></nav>
    </div>
  </main>
  <p class="made-with">This website was built with Claude Code.</p>
  <div class="detail" id="detail" aria-hidden="true">
    <div class="dp" id="dp"><div class="dp-inner" id="dpInner"></div></div>
    <div class="detail-media" id="detailMedia"><img id="detailImg" alt=""><div class="detail-dim" id="detailDim"></div></div>
    <aside class="detail-text" id="glass" aria-live="polite">
      <p class="g-meta" id="gMeta"></p>
      <h2 class="g-title" id="gTitle"></h2>
      <div class="g-sum" id="gSum"></div>
      <dl class="g-info" id="gInfo"></dl>
    </aside>
    <button class="detail-btn detail-toggle" id="detailToggle" aria-label="사진만 보기" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 7l10 10M17 9v8H9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="detail-btn detail-close" id="detailClose" aria-label="닫기"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="module" src="./app.js?v=e41fda37"></script>
</body>
</html>
